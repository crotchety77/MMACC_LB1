[project]
name = "expert-estimate"
version = "0.1.0"
description = "Экспертные оценки: математические методы анализа сложных систем (ММАСС)"
authors = [
    {name = "MystiSs", email = "vanz.vaf@yandex.ru"},
]
dependencies = [
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
# distribution = false

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
expert-estimate = "expert_estimate.algorithm:main"
expert-estimate-web = "api.main:run_server"
